<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Террикон — студия разработки: сайты, приложения, 3D</title>
    <meta
      name="description"
      content="Террикон — студия из Донецка: продающие лендинги, веб- и мобильные приложения, нагруженные платформы и 3D-моушн. Двое инженеров ведут проект от идеи до продакшена."
    />
    <meta name="theme-color" content="#0C0C0C" />
    <!-- OG-теги статические — боты мессенджеров не исполняют JS.
         Домена пока нет: og:image относительный (Telegram резолвит от URL
         страницы); при появлении домена заменить на абсолютный URL и добавить
         og:url + canonical. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Террикон" />
    <meta
      property="og:title"
      content="Террикон — студия разработки: сайты, приложения, 3D"
    />
    <meta
      property="og:description"
      content="Продающие лендинги, приложения, нагруженные платформы и 3D-моушн. Двое инженеров — от идеи до продакшена."
    />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Unbounded — дисплейный для заголовков, Golos Text — текстовый; оба с кириллицей -->
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;900&family=Golos+Text:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
