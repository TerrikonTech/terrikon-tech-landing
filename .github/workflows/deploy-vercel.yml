name: Deploy production to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrikontech-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, prerender and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.61.0
          python -m playwright install --with-deps chromium

      - name: Build Vercel production output
        run: |
          npx --yes vercel@56.3.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@56.3.1 build --prod --token="$VERCEL_TOKEN"

      - name: Prerender static HTML
        run: python scripts/prerender.py .vercel/output/static

      - name: Validate prerendered SEO content
        run: python scripts/validate_build.py .vercel/output/static

      - name: Deploy prebuilt output to production
        run: npx --yes vercel@56.3.1 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Notify IndexNow
        continue-on-error: true
        run: python scripts/submit_indexnow.py
