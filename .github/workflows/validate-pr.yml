name: Validate pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: terrikontech-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, prerender and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.61.0
          python -m playwright install --with-deps chromium

      - name: Prerender static HTML
        run: python scripts/prerender.py dist

      - name: Validate production output
        run: python scripts/validate_build.py dist
